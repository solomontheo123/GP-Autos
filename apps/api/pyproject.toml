[project]
name = "gp-autos-api"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
	"alembic>=1.18",
	"authlib>=1.6",
	"fastapi>=0.142.2",
	"httpx>=0.28",
	"itsdangerous>=2.2",
	"psycopg[binary]>=3.3.6,<4",
	"pydantic-settings>=2.10",
	"sqlalchemy[asyncio]>=2.1.1,<2.2",
	"uvicorn>=0.35",
]

[dependency-groups]
dev = ["mypy>=1.18", "pytest>=8.4", "pytest-asyncio>=1.2", "ruff>=0.14"]

[project.scripts]
seed = "app.seed:main"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008", "F401"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
disable_error_code = ["import-untyped"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
